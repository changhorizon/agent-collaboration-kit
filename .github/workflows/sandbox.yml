name: Sandbox

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check message fixtures
        run: python -B sandbox/verify_messages.py sandbox/fixtures/messages
      - name: Run sandbox tests
        run: python -B -m unittest discover -s sandbox/tests -v
